discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: relmcrm.com
  note: >-
    Served from the apex marketing host (relmcrm.com), while the JSON-RPC endpoint the card names lives on the
    API host (api.relmcrm.com/a2a). www.relmcrm.com 301s the path to the apex. The legacy /.well-known/agent.json
    is ALSO served and is byte-identical (3,236 bytes, cmp clean), so both discovery paths resolve to one
    document. Not an SPA catch-all: unrelated /.well-known/* paths on relmcrm.com (openid-configuration,
    oauth-authorization-server, api-catalog) return real HTML 404s, and api.relmcrm.com answers every unknown
    path with an application/problem+json 404. Ownership is not in question: provider.organization is "Relm"
    with provider.url https://relmcrm.com/, documentationUrl is https://relmcrm.com/docs, the OpenAPI on the
    same host titles itself "Relm CRM API" with servers[] https://api.relmcrm.com/v1, and the card's bearer
    description names the relm_live_/relm_test_ key prefixes the docs and OpenAPI also use.

- aid: relmcrm-com:relm-mcp-server
  name: Relm MCP Server
  description: >-
    First-party hosted Model Context Protocol server (Streamable HTTP) at https://api.relmcrm.com/mcp. 41 typed
    tools covering every REST capability — schema discovery, search, list/get/create/update/delete/restore on
    the four core objects, pipelines and stages, registry (types, fields, enum values), batch, automations,
    sequences with a dry-run preview, templates, connections, webhooks, usage and spend cap — each carrying MCP
    annotations (readOnlyHint / destructiveHint) and an oauth2 securitySchemes declaration. initialize and
    tools/list are anonymous; tools/call requires OAuth 2.1 (PKCE, dynamic client registration, scope crm) or a
    workspace bearer key, and an unauthenticated call returns the RFC 9728 WWW-Authenticate challenge.
  image: https://relmcrm.com/og.png
  humanURL: https://relmcrm.com/docs#mcp

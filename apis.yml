  name: Relm CRM REST API
  description: >-
    REST surface for the whole Relm workspace — contacts, companies, deals, activities (full CRUD with soft
    delete + restore), pipelines and stages, custom fields / enum values / object types, automations, drip
    sequences, templates, BYO messaging connections, webhooks with signed deliveries, cross-object search, a
    100-operation batch endpoint, usage and spend-cap settings, and a live self-describing GET /schema. 72
    operations across 41 paths, OpenAPI 3.1.0, servers[] https://api.relmcrm.com/v1. Bearer key or OAuth 2.1;
    RFC 9457 errors; keyset cursor pagination; Idempotency-Key on the four core creates; If-Match on updates.

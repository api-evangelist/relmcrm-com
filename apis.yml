aid: relmcrm-com
name: Relm
description: >-
  Relm is an API-first CRM built for LLMs and AI agents, operated by ASP FZE LLC (Sharjah, UAE) with data hosted
  in Helsinki, Finland. Contacts, companies, deals, activities, pipelines, automations, drip sequences,
  templates and webhooks are exposed three ways over one workspace key: a 72-operation OpenAPI 3.1 REST API at
  https://api.relmcrm.com/v1, a hosted Streamable-HTTP MCP server at https://api.relmcrm.com/mcp whose 41
  typed tools answer an anonymous tools/list, and an A2A 0.3.0 agent card at
  https://relmcrm.com/.well-known/agent-card.json backed by a JSON-RPC endpoint at https://api.relmcrm.com/a2a.
  Auth is a workspace bearer key (relm_live_ / free isolated relm_test_) or OAuth 2.1 with PKCE and RFC 7591
  dynamic client registration; errors are RFC 9457 problem+json carrying valid_options and a suggestion so an
  agent self-corrects; writes carry Idempotency-Key on the core creates and If-Match optimistic concurrency on
  updates. Priced per API request (Free 1,000/mo, Pro $29 for 100,000, Scale $249 for 2,000,000) rather than
  per seat. The web dashboard is described by the provider as "the thin part".

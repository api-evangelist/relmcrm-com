- aid: relmcrm-com:relm-a2a-agent
  name: Relm A2A Agent
  description: >-
    Agent2Agent (A2A 0.3.0) JSON-RPC endpoint at https://api.relmcrm.com/a2a. A message/send whose data part is
    {tool, arguments} runs one of the same 41 MCP tools synchronously and returns a terminal Task. Discovered by
    the agent card at https://relmcrm.com/.well-known/agent-card.json (also served at the legacy
    /.well-known/agent.json), which declares seven skills — manage contacts, companies, deals; log activities;
    automations; webhooks; describe schema — with oauth2 and bearer security schemes. Graded conformant against
    A2A 1.0.0. Listed on a2aregistry.org.
  image: https://relmcrm.com/og.png
  humanURL: https://relmcrm.com/agents
  baseURL: https://api.relmcrm.com/a2a

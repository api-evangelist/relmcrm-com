  list, every tool carrying an inputSchema, MCP annotations (readOnlyHint/destructiveHint/openWorldHint) and a securitySchemes[]
  declaring oauth2 scope crm. tools/call is gated: an anonymous call returns JSON-RPC error -32001 with WWW-Authenticate:
  Bearer realm="Relm", resource_metadata="https://api.relmcrm.com/.well-known/oauth-protected-resource" (observed
  2026-09-19), which is the RFC 9728 discovery hop an MCP client needs to offer OAuth. The same 41 tools are what
  the A2A endpoint runs (a message/send data part {tool, arguments}) and what the 72-operation REST surface exposes;
  see mcp/relmcrm-com-tool-crosswalk.yml for the binding.'

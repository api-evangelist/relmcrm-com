  against a real inputSchema and a real operation.
purpose: 'Make the MCP tool the discovery unit and bind it to the REST operation(s) that back it. Relm is unusually
  explicit that REST, MCP and A2A are one surface: the OpenAPI info.description says every operation is also a typed
  MCP tool, and the A2A endpoint runs the same tools by name. The crosswalk shows the MCP surface is a slightly
  COARSER projection of REST (object-parameterised tools fan out to four operations each) with two REST operations
  no tool reaches.'

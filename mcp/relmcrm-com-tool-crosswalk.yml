source: Derived by binding the 41 tools returned live by tools/list (mcp/relmcrm-com-mcp-tools-list.json, anonymous
  HTTP 200) to the 72 operationIds in openapi/_original/relmcrm-com-openapi.json (OpenAPI 3.1.0, verbatim from https://relmcrm.com/openapi.json).

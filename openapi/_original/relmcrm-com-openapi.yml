              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Workspace-scoped API key. relm_live_... (live) or relm_test_... (free, isolated test mode). Mint
        at https://app.relmcrm.com/.
    oauth2:
      type: oauth2
      description: 'OAuth 2.1 with PKCE (S256) and dynamic client registration (RFC 7591). Live mode only; test
        mode is API-key only. Discovery: /.well-known/oauth-authorization-server.'
      flows:
        authorizationCode:
          authorizationUrl: https://api.relmcrm.com/oauth/authorize
          tokenUrl: https://api.relmcrm.com/oauth/token
          refreshUrl: https://api.relmcrm.com/oauth/token
          scopes:
            crm: Read and write the connected Relm workspace
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100
      description: Page size (default 25, max 100).
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque keyset cursor from a prior next_cursor.
    IncludeDeleted:
      name: include_deleted
      in: query
      schema:
        type: boolean
      description: Include soft-deleted rows.
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
      description: 'Safely retry a create: same key + same body replays the original result.'
    IfMatch:
      name: If-Match
      in: header
      schema:
        type: string
      description: The record's current version for optimistic concurrency; a mismatch returns 412 version_conflict.
  responses:
    Problem:
      description: RFC-9457 problem+json error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC-9457 error. Closed-set rejections carry valid_options + suggestion so an agent self-corrects.
      properties:
        type:
          type: string
          format: uri
          example: https://relmcrm.com/errors/unknown_value
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          example: unknown_value
        field:
          type: string
        valid_options:
          type: array
          items:
            type: string
        suggestion:
          type: string
        request_id:
          type: string
    ListMeta:
      type: object
      properties:
        object:
          type: string
          const: list
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
    Deleted:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          type: boolean
    Contact:
      type: object
      properties:
        id:
          type: string
          example: con_...
        object:
          type: string
          const: contact
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        linkedin_url:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        company_id:
          type:
          - string
          - 'null'
        custom_fields:
          type: object
        version:
          type: integer
        mode:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted:
          type: boolean
    ContactInput:
      type: object
      description: At least one of name / email / phone / linkedin_url / company_id / a custom field.
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        linkedin_url:
          type: string
        type:
          type: string
        company_id:
          type: string
        custom_fields:
          type: object
    ContactList:
      allOf:
      - $ref: '#/components/schemas/ListMeta'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Contact'
    Company:
      type: object
      properties:
        id:
          type: string
          example: cmp_...
        object:
          type: string
          const: company
        name:
          type: string
        domain:
          type:
          - string
          - 'null'
        custom_fields:
          type: object
        version:
          type: integer
        mode:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted:
          type: boolean
    CompanyInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        domain:
          type: string
        custom_fields:
          type: object
    CompanyList:
      allOf:
      - $ref: '#/components/schemas/ListMeta'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Company'
    Deal:
      type: object
      properties:
        id:
          type: string
          example: deal_...
        object:
          type: string
          const: deal
        title:
          type: string
        value_cents:
          type:
          - integer
          - 'null'
          description: Integer minor units (cents).
        currency:
          type: string
        pipeline:
          type:
          - string
          - 'null'
          description: Pipeline KEY. Every deal carries its pipeline - group/filter by (pipeline, stage), never
            by stage alone (stage keys are not unique across pipelines).
        pipeline_name:
          type:
          - string
          - 'null'
          description: Human display name of the pipeline.
        stage:
          type:
          - string
          - 'null'
          description: Stage KEY within this deal's pipeline.
        stage_label:
          type:
          - string
          - 'null'
          description: Human display label of the stage.
        stage_type:
          type:
          - string
          - 'null'
          enum:
          - open
          - won
          - lost
          - null
          description: Semantic stage type - use this for won/lost, cross-pipeline, instead of string-matching the
            key.
        company_id:
          type:
          - string
          - 'null'
        primary_contact_id:
          type:
          - string
          - 'null'
        close_date:
          type:
          - string
          - 'null'
        custom_fields:
          type: object
        version:
          type: integer
        mode:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted:
          type: boolean
    DealInput:
      type: object
      required:
      - title
      properties:
        title:
          type: string
        value_cents:
          type: integer
        currency:
          type: string
        pipeline:
          type: string
          description: Pipeline key or pl_ id (defaults to the default pipeline).
        stage:
          type: string
          description: Stage key within the deal's pipeline.
        company_id:
          type: string
        primary_contact_id:
          type: string
        close_date:
          type: string
        custom_fields:
          type: object
    DealList:
      allOf:
      - $ref: '#/components/schemas/ListMeta'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Deal'
    Activity:
      type: object
      properties:
        id:
          type: string
          example: act_...
        object:
          type: string
          const: activity
        type:
          type: string
        body:
          type:
          - string
          - 'null'
        contact_id:
          type:
          - string
          - 'null'
        deal_id:
          type:
          - string
          - 'null'
        occurred_at:
          type: string
        custom_fields:
          type: object
        version:
          type: integer
        mode:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted:
          type: boolean
    ActivityInput:
      type: object
      description: Must attach to a contact_id and/or deal_id.
      properties:
        type:
          type: string
          description: A registered activity.type (note/email/call/meeting/task/...).
        body:
          type: string
        contact_id:
          type: string
        deal_id:
          type: string
        occurred_at:
          type: string
          description: ISO datetime; backdates imported history.
        custom_fields:
          type: object
    ActivityList:
      allOf:
      - $ref: '#/components/schemas/ListMeta'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Activity'
    Pipeline:
      type: object
      properties:
        id:
          type: string
          example: pl_...
        object:
          type: string
          const: pipeline
        key:
          type: string
        name:
          type: string
        is_default:
          type: boolean
        stages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              key:
                type: string
              label:
                type: string
              ordinal:
                type: integer
              type:
                type: string
                enum:
                - open
                - won
                - lost
                description: Semantic type; default open.
    PipelineInput:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        is_default:
          type: boolean
        stages:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Slugified on write (lowercase, [a-z0-9_]); original text kept as label.
              label:
                type: string
              type:
                type: string
                enum:
                - open
                - won
                - lost
    AutomationInput:
      type: object
      required:
      - name
      - trigger_event
      - actions
      properties:
        name:
          type: string
        trigger_event:
          type: string
          enum:
          - contact.created
          - contact.updated
          - deal.created
          - deal.updated
          - deal.stage_changed
        conditions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              op:
                type: string
              value: {}
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - send_email
                - send_message
                - create_activity
                - move_deal_stage
                - set_field
        enabled:
          type: boolean
    SequenceInput:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
        channel:
          type: string
        connection:
          type: string
        trigger:
          type: object
        exit_when:
          type: array
        steps:
          type: array
          items:
            type: object
            properties:
              wait_days:
                type: integer
              subject:
                type: string
              body:
                type: string
        enroll_existing:
          type: boolean
        enabled:
          type: boolean
    WebhookInput:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Public https endpoint (test mode allows localhost).
        events:
          type: array
          items:
            type: string
          description: Subset of the 5 events, or ["*"].
        description:
          type: string
        enabled:
          type: boolean
    Webhook:
      type: object
      properties:
        id:
          type: string
          example: wh_...
        object:
          type: string
          const: webhook
        url:
          type: string
        events:
          type: array
          items:
            type: string
        description:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        secret:
          type: string
          description: whsec_...; returned ONLY on create.
        version:
          type: integer
    Usage:
      type: object
      properties:
        period:
          type: string
        used:
          type: integer
        overage:
          type: integer
        limit:
          type: integer
        plan:
          type: string
    Settings:
      type: object
      properties:
        overage_cap_usd:

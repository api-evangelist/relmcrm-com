# x-archived-from: relmcrm-com-openapi.yml
# x-archived-on: 2026-09-26
openapi: 3.1.0
info:
  title: Relm CRM API
  version: 0.17.1
  summary: API-first CRM built for LLMs and AI agents.
  description: REST surface for Relm. Every operation is also available as a typed MCP tool at https://api.relmcrm.com/mcp
    and over A2A at https://api.relmcrm.com/a2a. Auth is either a workspace-scoped bearer key (relm_live_ / relm_test_)
    or an OAuth 2.1 access token (PKCE S256, dynamic client registration; discovery at /.well-known/oauth-authorization-server;
    live mode only). Errors are RFC-9457 problem+json with valid_options and a suggestion so an agent self-corrects.
    Read GET /schema first to learn the live objects, fields and enum values.
  contact:
    name: Relm
    url: https://relmcrm.com/
  license:
    name: Proprietary
servers:
- url: https://api.relmcrm.com/v1
  description: Production
security:
- bearerAuth: []
- oauth2:
  - crm
tags:
- name: Discovery
  description: Self-describing schema, usage, settings.
- name: Contacts
- name: Companies
- name: Deals
- name: Activities
- name: Pipelines
- name: Search
- name: Registry
  description: Custom fields, enums, object types.
- name: Automations
- name: Sequences
- name: Templates
- name: Connections
- name: Webhooks
- name: Batch
paths:
  /schema:
    get:
      tags:
      - Discovery
      operationId: getSchema
      summary: Live object/field/enum registry.
      description: Returns every object with its fields, id_prefix and list_filters, all enum groups, list_controls,
        the automation capability catalog, and usage notes. Call this before guessing a type, field or filter.
      responses:
        '200':
          description: Schema document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDoc'
        default:
          $ref: '#/components/responses/Problem'
  /usage:
    get:
      tags:
      - Discovery
      operationId: getUsage
      summary: Current billing period usage.
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        default:
          $ref: '#/components/responses/Problem'
  /settings:
    get:
      tags:
      - Discovery
      operationId: getSettings
      summary: Workspace settings (spend cap).
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Discovery
      operationId: setSettings
      summary: Set the monthly overage spend cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - overage_cap_usd
              properties:
                overage_cap_usd:
                  type:
                  - number
                  - 'null'
                  description: USD cap on metered overage; 0 = never any overage, null = unlimited.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        default:
          $ref: '#/components/responses/Problem'
  /search:
    get:
      tags:
      - Search
      operationId: search
      summary: Cross-object search over contacts, companies and deals.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Substring to match.
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 100
      responses:
        '200':
          description: Search results (has_more=true if any section was truncated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        default:
          $ref: '#/components/responses/Problem'
  /enums:
    get:
      tags:
      - Registry
      operationId: listEnums
      summary: All enum groups and their values.
      responses:
        '200':
          description: Enum groups
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Registry
      operationId: createEnumValue
      summary: Add a value to an enum group (idempotent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - group
              - value
              properties:
                group:
                  type: string
                  example: contact.type
                value:
                  type: string
                label:
                  type: string
      responses:
        '201':
          description: Updated value set
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /fields:
    post:
      tags:
      - Registry
      operationId: createField
      summary: Register a custom field on an object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - object
              - key
              properties:
                object:
                  type: string
                  enum:
                  - contact
                  - company
                  - deal
                  - activity
                key:
                  type: string
                label:
                  type: string
                data_type:
                  type: string
                  enum:
                  - text
                  - number
                  - boolean
                  - date
                  - select
                  - multiselect
                  - currency
                  - reference
                  - email
                  - url
                  default: text
                enum_group:
                  type: string
                required:
                  type: boolean
      responses:
        '201':
          description: Field set
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /types:
    post:
      tags:
      - Registry
      operationId: createType
      summary: Register a custom object type (schema grouping only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                label:
                  type: string
      responses:
        '201':
          description: Type set
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
  /contacts:
    get:
      tags:
      - Contacts
      operationId: listContacts
      summary: List contacts.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeDeleted'
      - name: q
        in: query
        schema:
          type: string
        description: Substring over name/email/phone/linkedin.
      - name: email
        in: query
        schema:
          type: string
      - name: company_id
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
        description: A registered contact.type value (validated).
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Contacts
      operationId: createContact
      summary: Create a contact.
      description: 'Needs at least one of: a name, an identifier (email/phone/linkedin_url), a company, or a custom
        field. Email is unique per workspace.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        default:
          $ref: '#/components/responses/Problem'
  /contacts/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Contacts
      operationId: getContact
      summary: Fetch a contact.
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Contacts
      operationId: updateContact
      summary: Update a contact.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Contacts
      operationId: deleteContact
      summary: Soft-delete a contact.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Problem'
  /contacts/{id}/restore:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Contacts
      operationId: restoreContact
      summary: Restore a soft-deleted contact.
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        default:
          $ref: '#/components/responses/Problem'
  /companies:
    get:
      tags:
      - Companies
      operationId: listCompanies
      summary: List companies.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeDeleted'
      - name: q
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Company list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Companies
      operationId: createCompany
      summary: Create a company (name required).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Problem'
  /companies/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Companies
      operationId: getCompany
      summary: Fetch a company.
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Companies
      operationId: updateCompany
      summary: Update a company.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Companies
      operationId: deleteCompany
      summary: Soft-delete a company.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Problem'
  /companies/{id}/restore:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Companies
      operationId: restoreCompany
      summary: Restore a company.
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Problem'
  /deals:
    get:
      tags:
      - Deals
      operationId: listDeals
      summary: List deals.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeDeleted'
      - name: q
        in: query
        schema:
          type: string
      - name: pipeline
        in: query
        schema:
          type: string
        description: 'Scope to ONE pipeline (key or pl_ id). Omit and you get deals from ALL pipelines merged -
          pass this whenever you reason about a single funnel, since stage keys are not unique across pipelines.
          Alias: pipeline_id.'
      - name: pipeline_id
        in: query
        schema:
          type: string
      - name: stage
        in: query
        schema:
          type: string
      - name: company_id
        in: query
        schema:
          type: string
      - name: primary_contact_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Deal list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Deals
      operationId: createDeal
      summary: Create a deal (title required).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        default:
          $ref: '#/components/responses/Problem'
  /deals/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Deals
      operationId: getDeal
      summary: Fetch a deal.
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Deals
      operationId: updateDeal
      summary: Update a deal (incl. moving stage/pipeline).
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Deals
      operationId: deleteDeal
      summary: Soft-delete a deal.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Problem'
  /deals/{id}/restore:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Deals
      operationId: restoreDeal
      summary: Restore a deal.
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
        default:
          $ref: '#/components/responses/Problem'
  /activities:
    get:
      tags:
      - Activities
      operationId: listActivities
      summary: List activities.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/IncludeDeleted'
      - name: contact_id
        in: query
        schema:
          type: string
      - name: deal_id
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
        description: A registered activity.type value (validated).
      responses:
        '200':
          description: Activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Activities
      operationId: createActivity
      summary: Log an activity (attach to a contact and/or deal).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        default:
          $ref: '#/components/responses/Problem'
  /activities/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      tags:
      - Activities
      operationId: getActivity
      summary: Fetch an activity.
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Activities
      operationId: updateActivity
      summary: Update an activity.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Activities
      operationId: deleteActivity
      summary: Soft-delete an activity.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Problem'
  /activities/{id}/restore:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      tags:
      - Activities
      operationId: restoreActivity
      summary: Restore an activity.
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        default:
          $ref: '#/components/responses/Problem'
  /pipelines:
    get:
      tags:
      - Pipelines
      operationId: listPipelines
      summary: List pipelines with their ordered stages.
      responses:
        '200':
          description: Pipelines
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Pipelines
      operationId: createPipeline
      summary: Create a pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
  /pipelines/{key}:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
      description: Pipeline key or pl_ id.
    get:
      tags:
      - Pipelines
      operationId: getPipeline
      summary: Fetch a pipeline.
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Pipelines
      operationId: updatePipeline
      summary: 'Update a pipeline: display `name`, `is_default`, and/or re-`key` it. The key is slugified; deals
        attach by internal id, so a re-key never orphans them. A soft-deleted pipeline''s key is reusable.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New display name
                key:
                  type: string
                  description: New pipeline key (slugified); deals follow by internal id.
                is_default:
                  type: boolean
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Pipelines
      operationId: deletePipeline
      summary: Delete a pipeline (fails if deals still use it).
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        default:
          $ref: '#/components/responses/Problem'
  /pipelines/{key}/default:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Pipelines
      operationId: setDefaultPipeline
      summary: Make this pipeline the workspace default.
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
  /pipelines/{key}/stages:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Pipelines
      operationId: addStage
      summary: Add a stage to a pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                  description: Slugified on write; original kept as label.
                label:
                  type: string
                ordinal:
                  type: integer
                type:
                  type: string
                  enum:
                  - open
                  - won
                  - lost
      responses:
        '201':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
  /pipelines/{key}/stages/reorder:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Pipelines
      operationId: reorderStages
      summary: Reorder stages (order = a permutation of every existing stage key).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order
              properties:
                order:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
  /pipelines/{key}/stages/{stage}:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        type: string
    - name: stage
      in: path
      required: true
      schema:
        type: string
    patch:
      tags:
      - Pipelines
      operationId: updateStage
      summary: Rename/retype a stage. `key` is slugified; deals on the stage follow automatically (linked by internal
        id), so this safely fixes a typo'd key or sets the semantic type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: New key (slugified).
                label:
                  type: string
                type:
                  type: string
                  enum:
                  - open
                  - won
                  - lost
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Pipelines
      operationId: deleteStage
      summary: Delete a stage (fails if deals use it).
      responses:
        '200':
          description: Pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        default:
          $ref: '#/components/responses/Problem'
  /automations:
    get:
      tags:
      - Automations
      operationId: listAutomations
      summary: List automations.
      responses:
        '200':
          description: Automations
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Automations
      operationId: createAutomation

summary: >-
  Three self-serve tiers priced per API request rather than per seat ("because your main user is a machine").
  Free 1,000 requests/month with no credit card; Pro $29/month for 100,000; Scale $249/month for 2,000,000.
  Overage on paid plans is metered at $0.0001 per request with an optional hard spend cap the customer sets
  (PATCH /v1/settings overage_cap_usd; a $0 cap makes a paid plan hard-stop like Free). Test mode is free,
  unmetered and never counts. No enterprise or contact-sales tier is published; nav link /pricing 404s — the
  pricing lives in the #pricing section of the home page.

metering:
  test_mode_counts: false
  batch: metered per operation (POST /v1/batch up to 100 operations)
  mcp_array_post: metered per tool call
  spend_cap: 'PATCH /v1/settings {"overage_cap_usd": <number|null>} (relm_set_spend_cap); $0 hard-stops like Free'
exhaustion_codes:
- status: 429
  code: rate_limited
  meaning: Too many requests this minute. Back off and retry (see Retry-After).
- status: 429
  code: quota_exceeded
  meaning: The monthly request quota was reached. Check GET /v1/usage; upgrade to continue.
- status: 429
  code: spend_cap_reached
  meaning: 'The monthly overage spend cap was reached. Raise or clear it: PATCH /v1/settings {"overage_cap_usd": null}.'
- status: 403
  code: plan_limit
  meaning: A plan cap was reached (e.g. Free allows 2 automations / 1 sequence).

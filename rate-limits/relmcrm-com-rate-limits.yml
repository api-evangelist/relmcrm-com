checked: '2026-09-19'
corroboration: >-
  Live anonymous probes on 2026-09-19 (GET https://api.relmcrm.com/v1/schema -> 401 problem+json; POST
  https://api.relmcrm.com/mcp tools/call -> 401) returned no X-RateLimit-* or X-Quota-* headers, which is
  consistent with the docs: the headers ride on authenticated responses, and this pass holds no key. Header
  NAMES below come from the docs; no numeric value has been observed live.
confidence: medium
confidence_note: >-
  The per-minute rate limit is documented to exist but its NUMBER is not published anywhere (docs, llms.txt,
  pricing, error reference); Scale advertises "top-tier rate limits" without a figure. The monthly quotas are
  published exactly. Treat the header family as authoritative for client design and read the live limit from
  X-RateLimit-* on the first authenticated response.

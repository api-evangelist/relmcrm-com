note: >-
  Harvest only. Every signal below is a page that carries the substance (a dated subprocessor table, a named
  hosting region, a request channel with a response period, an exit clause), not a page that mentions the
  word. Nothing is inferred about which regime applies. Absent signals (sbom, accessibility_conformance,
  training_data_summary, ai_transparency, global_privacy_control, incident_notification, age_assurance,
  notice_and_action, transparency_report, support_lifetime) were looked for on the conventional paths above
  and in the docs and were not found; that absence is the measurement. The privacy policy's "not directed at
  anyone under 16" is an audience statement, not an age-assurance mechanism, and "We never train on your data"
  is a customer-data commitment by a company that ships no model, not a training-data summary — neither is
  recorded as a signal.

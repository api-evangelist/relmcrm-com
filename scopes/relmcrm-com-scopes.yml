summary: >-
  One scope. Relm's OAuth 2.1 server issues a single coarse scope, crm, that grants read and write over the
  connected workspace; there is no read-only scope, no per-object scope and no admin/billing split. The scope
  set is the same in the OpenAPI, the RFC 8414 metadata (scopes_supported), the RFC 9728 protected-resource
  document (scopes_supported), the agent card, the MCP descriptor and every MCP tool's securitySchemes[]
  (oauth2, scopes [crm]). OAuth acts on live data only; test mode is API-key only.
